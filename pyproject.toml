[project]
name = "engram"
version = "0.1.0"
description = "AI workflow evaluation and experimentation framework"
readme = "README.md"
authors = [
    { name = "Jason Hyde", email = "github@2bad.me" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.100.0",
    "httpx>=0.28.1",
    "openai>=2.36.0",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "typer>=0.25.1",
]

[project.scripts]
engram = "engram.cli:run"

[build-system]
requires = ["uv_build>=0.11.3,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "poethepoet>=0.45.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.poe.tasks]
test = "pytest"
coverage = "pytest --cov=engram --cov-report=term-missing"
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
typecheck = "ty check ."
