name: Test

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [master]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          activate-environment: true
      - run: uv sync --dev
      - run: poe lint
      - run: poe format-check
      - run: poe typecheck
      - run: poe test
